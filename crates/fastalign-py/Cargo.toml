[package]
name = "fastalign-py"
description = "Python bindings for fastalign-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
fastalign-core = { path = "../fastalign-core" }
rayon = "1.12.0"
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
