[package]
name = "fastalign-core"
description = "Core of fastalign revisited: a modern, bit-exact reimplementation of fast_align"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
clap = { version = "4.6.8", features = ["derive"] }
memchr = "2.8.3"
memmap2 = "0.9.12"
rayon = "1.12.0"
rustc-hash = "2.1.3"

[dev-dependencies]
criterion = "0.7.0"
tempfile = "3.27.0"

[[bench]]
name = "load"
harness = false
