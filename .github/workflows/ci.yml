name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The bit-exact maths vectors depend on the CPU's libm variant; see tests/math_vectors.rs.
      - run: cargo test --workspace
        env:
          FASTALIGN_MATH_VECTORS: tolerant
      - run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install maturin pytest numpy ruff sentencepiece
          maturin develop --release
          pytest
          ruff check python tests
